# Single declaration of the ansible virtualenv's package set.
#
# Replaces the two hardcoded arrays that lived in lib/developer.sh and the
# prose list in CLAUDE.md. uv.lock beside this file pins the full transitive
# closure with hashes; nothing installs from these names directly.
#
# [project] exists only to carry requires-python — [tool.uv] cannot express it
# (measured: uv still warns and defaults the floor). package = false keeps this
# from being an installable distribution.

[project]
name = "dotfiles-venv"
version = "0"
requires-python = "==3.14.*"

[tool.uv]
package = false

# LICENSE POSTURE, reviewed 2026-08-20. Three direct deps are GPL:
# ansible and ansible-lint (GPL-3.0-or-later), pylint (GPL-2.0-or-later).
# Accepted. All three predate this file — they are in origin/master's
# _pip_pkgs at both sites and installed on both machines today, so this
# manifest makes an existing posture visible rather than creating it.
# GPL obligations attach to DISTRIBUTION; this repo sets package = false,
# declares no build-system, and is not published. All three are invoked as
# CLI tools, not linked as libraries. ansible is the reason the venv exists.

[dependency-groups]
# Used only by the venv itself: ansible/terraform execution and the interactive
# tooling that lives alongside it.
runtime = [
  "ansible",                       # the reason this venv exists
  "ansible-lint",
  "molecule",
  "molecule-plugins[docker]",
  "certbot",                       # cert renewal on the homelab
  "certbot-dns-cloudflare",
  "checkov>=3.3.13",               # terraform static analysis.
                                   #
                                   # FLOORED, not unconstrained. Operator
                                   # decision 2026-08-21. The floor exists
                                   # because an unconstrained checkov was
                                   # silently downgraded a year by an
                                   # unrelated bump: dotfiles#227, titled
                                   # "bump asteval from 1.0.6 to 1.0.9",
                                   # walked checkov 3.3.13 -> 3.2.414 and
                                   # dropped asteval and ecdsa entirely.
                                   # checkov pins asteval EXACTLY (==1.0.5
                                   # up to 3.2.477, ==1.0.6 from 3.2.482),
                                   # so forcing 1.0.9 made every checkov
                                   # >=3.2.459 unsatisfiable and the
                                   # resolver picked an older checkov that
                                   # needs no asteval at all. Dependabot
                                   # edited the LOCK, not this file, so
                                   # nothing here recorded it.
                                   #
                                   # The floor does not prevent that
                                   # conflict — it makes it LOUD. Measured:
                                   # floor + a forced asteval>=1.0.9 now
                                   # errors "No solution found", naming
                                   # both packages, instead of downgrading.
                                   #
                                   # ACCEPTED RISK, re-affirmed 2026-08-21.
                                   # Two transitive advisories return with
                                   # the floor and cannot be cleared while
                                   # staying current:
                                   #   asteval 1.0.6 — TWO DISTINCT
                                   #     advisories, not one with two IDs.
                                   #     Both fixed in 1.0.9, which checkov
                                   #     forbids:
                                   #       GHSA-9w56-46f6-3qhx (no alias) —
                                   #         arbitrary process-memory read
                                   #         and write via numpy ctypes, in
                                   #         the DEFAULT config. The more
                                   #         severe of the two.
                                   #       GHSA-89v8-rhwq-hf77 =
                                   #         CVE-2026-55244 — sandbox escape
                                   #         via BaseException subclasses.
                                   #   ecdsa 0.19.2 — ONE advisory, three
                                   #     IDs: GHSA-wj6h-64fc-37mp =
                                   #     CVE-2024-23342 = PYSEC-2026-1325.
                                   #     Minerva timing attack on P-256 via
                                   #     sign_digest(). No upstream fix.
                                   # None is reachable UNDER CURRENT
                                   # USAGE: all three need an attacker-
                                   # controlled expression or a signing
                                   # operation, and checkov signs nothing
                                   # and evaluates only the operator's own
                                   # policies.
                                   #
                                   # Read that as a property of how checkov
                                   # is deployed, NOT of these packages.
                                   # Nothing in asteval or ecdsa mitigates
                                   # anything; asteval's own sandbox is what
                                   # GHSA-89v8-rhwq-hf77 escapes. The
                                   # condition holding the risk down is
                                   # "every policy evaluated here was
                                   # written by the operator" -- and that
                                   # expires the moment checkov is pointed
                                   # at a repository carrying third-party
                                   # custom policies. It expires SILENTLY:
                                   # no gate re-reads this comment, and
                                   # widening checkov's scope is a plausible
                                   # near-term change (wiring it into
                                   # terraform_ansible's aws/azure/gcp
                                   # directories is an open backlog item).
                                   # Re-affirm this block, do not inherit
                                   # it, if that scope changes. Enumerated
                                   # from OSV 2026-08-21, not from the
                                   # previous comment — which stated two
                                   # IDs as one advisory and named the
                                   # milder mechanism.
                                   #
                                   # The rejected alternative is what #227
                                   # produced by accident: asteval>=1.0.9
                                   # reaches 0 advisories but pins checkov
                                   # to 2025-05-01 — 15 months of missed
                                   # IaC rules, judged the larger security
                                   # cost. Revisit when upstream unpins.
  "docker",
  "gmpy2",                         # arbitrary precision, used by math repo work
  "jmespath",                      # ansible json_query filter
  "mpmath",
  "netaddr",                       # ansible ipaddr filter
  "passlib",                       # ansible password_hash filter
  "psutil",
  "bpytop",                        # interactive; pins psutil < 6
  "HttpPy",                        # FLAGGED FOR REMOVAL: v0.0.9, last release
                                   # 2019-10-21, no repo push in 39 months, PyPI
                                   # download stats unavailable, and zero measured
                                   # consumers fleet-wide. Not a typosquat — it
                                   # predates httpx — just unjustifiable. Operator
                                   # decision; kept for now to avoid a silent
                                   # behaviour change.
  "j2cli",                         # FLAGGED FOR REMOVAL: last release 2019-06-07,
                                   # no repo push in 26 months, zero measured
                                   # consumers fleet-wide. Same call as HttpPy.
  "shell-gpt",                     # interactive; pins openai < 3
  "scikit-learn",
  "scipy",
  "pandas",
  "matplotlib",
  "seaborn",
  "ipython",
  "jupyterlab",
  "setuptools",                    # vendors wheel; explicit since a setuptools
                                   # bump silently changes the vendored copy
  "mlx ; sys_platform == 'darwin'",
]

# Must match what five repos' CI installs. Exported to requirements-ci.txt.
test-lint = [
  "bandit",
  "cosmic-ray",                    # mutation testing (make mutants); a TEST tool --
                                   # it sat in runtime until 2026-08-21, so it was
                                   # absent from requirements-ci.txt, which renders
                                   # --only-group test-lint. ai-config, math and
                                   # state-ledger CI all install it.
  "coverage",
  "hypothesis",
  "mypy",
  "pip-audit",
  "pyright",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pre-commit",
  "radon",
  "ruff",
  "vulture",
]

# ── CI-scoped groups ─────────────────────────────────────────────────────────
#
# These are NOT "test-lint minus the unused bits". That shape was measured and
# rejected: dropping every genuinely-uninvoked tool takes the test-lint
# rendering 80 -> 73 pins, so a consumer running three tools still installs 70
# it never runs. The useful boundary is PURPOSE, not CI-versus-local.
#
# BOUNDARY, stated here rather than living in reviewers' heads:
#
#   ci-test      exactly what a per-PR `test`/`lint` job runs.
#   ci-mutation  exactly what a mutation job runs.
#
# A tool needed by some other job does NOT belong in ci-test. The failure mode
# for these groups is the old one recurring -- a repo needs one more tool, it
# lands in ci-test because that is where tools go, and in a year ci-test is the
# union again and this comment is the only thing that was supposed to stop it.
#
# hypothesis is the first instance of that pressure and is admitted
# deliberately, on a measurement rather than a principle: it is a test-time
# library that only two repos import, and including it costs 2 packages
# (hypothesis, sortedcontainers) against the cost of a third group and a third
# render target. Two packages is cheaper than the machinery. Anything costing
# materially more gets its own group instead.
ci-test = [
  "ruff",
  "pytest",
  "pytest-cov",                    # pulls coverage transitively
  "hypothesis",
  # pyright and mypy were added 2026-08-22 after measuring the fleet's actual
  # CI job layout rather than one consumer's needs. In ai-config's ci.yml and
  # every math *-py.yml they run in the SAME per-PR `test` job as ruff and
  # pytest -- so by this group's own definition they belong here. The original
  # slice was cut from etch-cli alone, which runs three tools, and served no
  # repo completely as a result.
  #
  # Cost measured before folding, per the hypothesis precedent: +3 and +6 pins,
  # 11 -> 19 total. pip-audit was measured at +24 and split out instead.
  "pyright",
  "mypy",
]

# pip-audit is dependency AUDITING, not test/lint, and it is separated on that
# ground rather than on cost -- the same call rust.md records for `cargo audit`,
# which lives in its own workflow in both Rust repos. It happens to be
# co-located in one job in the Python repos; purpose is the boundary here, not
# job layout.
#
# The cost is what makes the distinction pay: pip-audit's closure is +24 pins
# (cyclonedx-python-lib, packageurl-python, license-expression, cachecontrol,
# requests, urllib3 and friends), more than doubling ci-test. A repo that runs
# a linter and a test suite should not install an SBOM library to do it.
#
# Consumers needing both install two hashed files as two `pip install -r` lines
# -- required anyway, since --require-hashes forbids mixing a hashed file with
# a loose extra on one line.
ci-audit = [
  "pip-audit",
]

# cosmic-ray is split out because it is the whale: its closure is ~29 packages
# and carries SQLAlchemy, aiohttp, GitPython, yarl, frozenlist and multidict.
# It is PR-triggered in ai-config and math -- but from mutation-pr.yml, a
# SEPARATE workflow from the job that runs `make test`. So the per-PR test path
# never needs it, and a repo that does not mutation-test should not carry an
# ORM, an HTTP client and a git library in order to run a linter.
ci-mutation = [
  "cosmic-ray",
]
