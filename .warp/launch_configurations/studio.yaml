---
name: studio
windows:
  - tabs:
      - title: update-studio
        layout:
          cwd: /Users/bruce/git-repos/personal/dotfiles
          commands:
            - exec: git status
      - title: update-laptop
        layout:
          cwd: /Users/bruce
          commands:
            # The laptop answers as laptop-1 on wireless. Choose the name by whether port 22
            # answers (macOS nc -G is the connect timeout), never by ssh's exit status: 255
            # also means a failed host-key check, which must not send the session elsewhere.
            - exec: if nc -z -G 3 laptop 22 2>/dev/null; then ssh -t laptop; else ssh -t laptop-1; fi
      - title: update-workstation
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t workstation
      - title: update-claude
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude
      - title: etch-cli
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session etch-cli
      - title: etch-config
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session etch-config
      - title: dotfiles
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session dotfiles
      - title: ai-config
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session ai-config
      - title: ai-devops
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session ai-devops
      - title: math
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session math
      - title: ansible
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t workstation .local/bin/repo-session terraform_ansible/ansible
      # Local working tabs on the Studio. ansible-local only opens the playbook
      # directory: `make update-vms` / `make update-hosts` stay hand-run.
      - title: ansible-local
        layout:
          cwd: /Users/bruce/git-repos/personal/terraform_ansible/ansible
          commands:
            - exec: git status
      - title: ratna
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t ratna
      - title: codex-ai-config
        layout:
          cwd: /Users/bruce/git-repos/personal/ai-config
          commands:
            - exec: tmux new-session -A -s codex-ai-config
      - title: scratch-math
        layout:
          cwd: /Users/bruce/git-repos/personal/math/descartes/descartes-rs
      - title: scratch
        layout:
          cwd: /Users/bruce
