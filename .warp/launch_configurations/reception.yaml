---
name: reception
windows:
  - tabs:
      # Local tabs first. ansible-local only opens the playbook directory:
      # `make` runs stay hand-run. home and office are the other work Macs.
      - title: update-reception
        layout:
          cwd: /Users/bruce/git-repos/personal/dotfiles
          commands:
            - exec: git status
      - title: ansible-local
        layout:
          cwd: /Users/bruce/git-repos/personal/terraform_ansible/ansible
          commands:
            - exec: export ENV=genexxe_centrepointe
            - exec: git status
      - title: update-home
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t home
      - title: update-office
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t office
      - title: scratch
        layout:
          cwd: /Users/bruce
      - title: etch-cli
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session etch-cli
      - title: etch-config
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session etch-config
      - title: dotfiles
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session dotfiles
      - title: ai-config
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session ai-config
      - title: ai-devops
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session ai-devops
      - title: math
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t claude .local/bin/repo-session math
      - title: ansible
        layout:
          cwd: /Users/bruce
          commands:
            - exec: ssh -t workstation .local/bin/repo-session terraform_ansible/ansible
