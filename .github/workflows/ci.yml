name: CI

on:
  pull_request:
    # labeled re-runs the gate when automerge-ok is applied after the PR
    # opens; ready_for_review covers a draft marked ready (not a default type).
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches:
      - master

# Bots apply labels in a burst, each firing a `labeled` run; cancel the
# superseded ones. A job-level label filter that skips reads as passing, so
# the gate script decides instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30 # provisional; re-size to ~3x p90 after five green runs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: sudo apt-get install -y bats zsh parallel

      - name: Install shellcheck (pinned)
        env:
          SC_VER: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SC_VER}"

      - name: Install uv (pinned)
        env:
          UV_VER: "0.13.0"
          UV_SHA256: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VER}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          uv --version | grep -q "uv ${UV_VER}"

      - name: Tool versions
        run: |
          locale
          locale -a
          command -v sort comm || true
          sort --version | head -1
          comm --version | head -1
          /usr/bin/sort --version | head -1
          /usr/bin/comm --version | head -1

      # One list per shard, computed once: make, the suite report and the
      # gate all read this file. The matrix list is the only place the shard
      # count is written.
      - name: Compute shard list
        run: bash scripts/bats-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}" > "shard-${{ matrix.shard }}.files"

      # Only shard 1 carries the non-bats half of `make test`.
      - name: Run test prerequisites (shard 1 only)
        if: matrix.shard == 1
        run: make test-prereqs < /dev/null

      # The list and trace dir reach the script as arguments, built by the
      # Makefile from these step-env entries; never put them on a command line.
      - name: Run traced suite
        env:
          BATS_FILES_FROM: shard-${{ matrix.shard }}.files
          COVERAGE_TRACE_DIR: shard-out
        run: make bash-coverage < /dev/null

      # No `if:`: a green make over fewer tests than declared must fail.
      - name: Check executed tests equal declared
        run: bash scripts/ci-suite-report.sh shard-out/bats_run.log --files "shard-${{ matrix.shard }}.files"

      - name: Stage the list and trace
        run: |
          mkdir -p shard-upload
          cp "shard-${{ matrix.shard }}.files" shard-upload/
          cp shard-out/bash_trace.txt "shard-upload/shard-${{ matrix.shard }}.trace"

      # Default success() condition on purpose: a shard that failed leaves no
      # list or trace for this attempt, so the gate's pairing check fails too.
      - name: Upload the shard list and trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-${{ github.run_attempt }}-${{ matrix.shard }}
          path: shard-upload
          retention-days: 7
          if-no-files-found: error

      # The script writes the log before its red check, so it exists on a
      # failed run. overwrite lets a re-run attempt upload at all and replaces
      # the earlier attempt's log: download it before re-running.
      - name: Upload the full traced log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-shard-log-${{ matrix.shard }}
          path: shard-out/bats_run.log
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  # Required check and auto-merge gate. Runs even when a shard failed so the
  # check reports red rather than skipped.
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the badge push
    steps:
      - name: Require every shard to have succeeded
        run: |
          printf 'test-shard result: %s\n' "${{ needs.test-shard.result }}"
          [ "${{ needs.test-shard.result }}" = "success" ] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: test-shard-${{ github.run_attempt }}-*
          merge-multiple: true
          path: cov-shards

      - name: Check lists cover every test file once and each has a trace
        run: bash scripts/ci-shard-gate.sh --with-traces cov-shards

      - name: Score the union of the shard traces (gate at 91%)
        run: |
          bash scripts/run-bash-coverage.sh --score cov-shards/shard-*.trace > /tmp/bash-cov-out.txt 2>&1 || { cat /tmp/bash-cov-out.txt; exit 1; }
          cat /tmp/bash-cov-out.txt
          PCT=$(grep "^Overall bash coverage:" /tmp/bash-cov-out.txt | grep -oE '[0-9]+')
          if [ -z "${PCT}" ]; then
            printf "FAIL: coverage output not found\n" >&2
            exit 1
          fi
          printf "Coverage: %d%%\n" "${PCT}"
          if [ "${PCT}" -lt 91 ]; then
            printf "FAIL: bash coverage %d%% is below the 91%% gate\n" "${PCT}" >&2
            exit 1
          fi

      - name: Publish bash coverage badge
        run: |
          PCT=$(grep "^Overall bash coverage:" /tmp/bash-cov-out.txt | grep -oE '[0-9]+')
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          printf '{"schemaVersion":1,"label":"bash coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/bash.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: bash.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

  # TEMPORARY (draft PR only, V1 headroom proof): today's single traced run on
  # the same SHA, compared line by line with the shard union. Reverted before
  # the PR is marked ready. Not in auto-merge's needs.
  headroom-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: sudo apt-get install -y bats zsh parallel

      - name: Install shellcheck (pinned)
        env:
          SC_VER: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SC_VER}"

      - name: Install uv (pinned)
        env:
          UV_VER: "0.13.0"
          UV_SHA256: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VER}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          uv --version | grep -q "uv ${UV_VER}"

      - name: Run the full traced suite
        run: make bash-coverage < /dev/null

      - name: Stage the baseline trace
        run: |
          mkdir -p baseline-upload
          LC_ALL=C sort -u coverage/bash_trace.txt > baseline-upload/baseline.trace
          test -s baseline-upload/baseline.trace
          wc -l < baseline-upload/baseline.trace

      - name: Upload the baseline trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headroom-baseline-${{ github.run_attempt }}
          path: baseline-upload
          retention-days: 7
          if-no-files-found: error

  # TEMPORARY (draft PR only, V1): scores both, prints lost and gained lines.
  headroom-diff:
    needs: [test-shard, headroom-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: test-shard-${{ github.run_attempt }}-*
          path: cov-shards
          merge-multiple: true

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: headroom-baseline-${{ github.run_attempt }}
          path: baseline

      - name: Score union and baseline, diff the lines
        run: |
          test -s baseline/baseline.trace
          LC_ALL=C sort -u cov-shards/shard-*.trace > union.trace
          echo "== union =="; bash scripts/run-bash-coverage.sh --score union.trace | grep -E '^(TOTAL|Overall bash coverage)'
          echo "== baseline =="; bash scripts/run-bash-coverage.sh --score baseline/baseline.trace | grep -E '^(TOTAL|Overall bash coverage)'
          LC_ALL=C comm -23 baseline/baseline.trace union.trace > lost.txt
          LC_ALL=C comm -13 baseline/baseline.trace union.trace > gained.txt
          echo "== lost by union: $(wc -l < lost.txt) lines, gained: $(wc -l < gained.txt) lines =="
          echo "-- lost, by file --"; sed "s#^${GITHUB_WORKSPACE}/##; s#:[0-9]*\$##" lost.txt | sort | uniq -c | sort -rn
          echo "-- lost lines --"; sed "s#^${GITHUB_WORKSPACE}/##" lost.txt
          echo "-- gained, by file --"; sed "s#^${GITHUB_WORKSPACE}/##; s#:[0-9]*\$##" gained.txt | sort | uniq -c | sort -rn

  lint-macos:
    runs-on: macos-latest
    timeout-minutes: 10 # p90 12s, floor, measured 2026-08-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Syntax check all shell scripts (bash)
        run: |
          files=$(make print-SHELL_FILES | tr ' ' '\n' | grep -c .)
          if [ "${files}" -eq 0 ]; then
            printf 'shell file list is EMPTY - refusing to pass having checked nothing\n' >&2
            exit 1
          fi
          make print-SHELL_FILES | tr ' ' '\n' | xargs -I{} bash -n {}

      - name: Syntax check all zsh files
        run: |
          files=$(git ls-files '*.zsh' '*.zsh-theme' '.zshrc' '.zprofile' '.zshenv' 'config/profiles.sh')
          if [ -z "${files}" ]; then
            printf 'zsh file list is EMPTY - refusing to pass having checked nothing\n' >&2
            exit 1
          fi
          printf '%s\n' "${files}" | xargs -I{} zsh -n {}

  test-macos-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 30 # provisional; re-size to ~3x p90 after five green runs
    # The repo's default token is read-write, and this job runs unpinned
    # Homebrew bottles. It only needs to read the checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # coreutils supplies `timeout`, which macOS does not ship and which six
      # tests use to bound a hang. Every provisioned mac has it: it is an
      # untagged Brewfile entry.
      - name: Install bash, bats, GNU parallel and coreutils
        run: brew install bash bats-core parallel coreutils

      - name: Install shellcheck (pinned)
        env:
          SC_VER: "0.11.0"
          SC_SHA256: "56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79"
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.darwin.aarch64.tar.xz"
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SC_VER}"

      - name: Install uv (pinned)
        env:
          UV_VER: "0.13.0"
          UV_SHA256: "a9c1b29002cf3c83f07fa9cd8a887a3be0107d90e23189721221e7257db8e3d6"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VER}/uv-aarch64-apple-darwin.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m755 /tmp/uv-aarch64-apple-darwin/uv /usr/local/bin/uv
          uv --version | grep -q "uv ${UV_VER}"

      - name: Tool versions
        run: |
          bash --version | head -1
          bats --version
          make --version | head -1
          parallel --version | head -1

      # One list per shard, computed once: make, the suite report and the
      # gate all read this file. The matrix list is the only place the shard
      # count is written.
      - name: Compute shard list
        run: bash scripts/bats-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}" > "shard-${{ matrix.shard }}.files"

      - name: Run tests
        env:
          BATS_FILES_FROM: shard-${{ matrix.shard }}.files
        run: |
          set +e
          if [ "${{ matrix.shard }}" = "1" ]; then
            make test > /tmp/make-test.log 2>&1 < /dev/null
          else
            make test-bats > /tmp/make-test.log 2>&1 < /dev/null
          fi
          rc=$?
          bash scripts/ci-suite-report.sh /tmp/make-test.log --files "shard-${{ matrix.shard }}.files"
          report_rc=$?
          if [ "${rc}" -ne 0 ]; then
            printf 'make exited %d\n' "${rc}" >&2
            tail -40 /tmp/make-test.log
            exit 1
          fi
          exit "${report_rc}"

      # Default success() condition on purpose: a shard that failed leaves no
      # list for this attempt, so the gate's coverage check fails too.
      - name: Upload the shard list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-macos-shard-${{ github.run_attempt }}-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.files
          retention-days: 7
          if-no-files-found: error

      # The tail above can miss the cause: on dotfiles#358 it showed 3327 ok,
      # no `not ok`, and bats still exiting 1. Keep the whole log. cancelled()
      # covers the job timeout, where failure() alone is false; it also fires
      # when cancel-in-progress supersedes a run, which costs only the upload.
      # overwrite lets a re-run attempt upload at all, and so replaces the
      # earlier attempt's log: download it before re-running.
      - name: Upload the full make test log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-macos-make-test-log-${{ matrix.shard }}
          path: /tmp/make-test.log
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  # Required check and auto-merge gate. Runs even when a shard failed so the
  # check reports red rather than skipped. The shard result is one signal;
  # list coverage is the independent one.
  test-macos:
    needs: test-macos-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require every shard to have succeeded
        run: |
          printf 'test-macos-shard result: %s\n' "${{ needs.test-macos-shard.result }}"
          [ "${{ needs.test-macos-shard.result }}" = "success" ] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: test-macos-shard-${{ github.run_attempt }}-*
          merge-multiple: true
          path: shard-lists

      - name: Check the shard lists cover every test file once
        run: bash scripts/ci-shard-gate.sh shard-lists

  powershell:
    # Pinned: packages.microsoft.com/ubuntu/26.04 has no powershell package, and
    # ubuntu-latest became 26.04 on 2026-10-23. Unpin once it does.
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # p90 60s, measured 2026-08-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          source /etc/os-release
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install Pester + PSScriptAnalyzer
        run: |
          pwsh -Command "Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0"
          pwsh -Command "Install-Module PSScriptAnalyzer -Force -Scope CurrentUser"

      - name: Run tests with coverage gate
        working-directory: powershell
        run: |
          set -o pipefail
          make test | tee /tmp/pester-out.txt

      - name: Publish PowerShell coverage badge
        run: |
          PCT=$(grep "^Coverage:" /tmp/pester-out.txt | grep -oP '\d+(?:\.\d+)?' | head -1 | python3 -c "import sys,math; print(math.floor(float(sys.stdin.read().strip())))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          printf '{"schemaVersion":1,"label":"PowerShell coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/powershell.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: powershell.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 8s, floor, measured 2026-08-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -e
          source lib/constants.sh
          wget -qO /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts "HEAD~50..HEAD" \
            --verbose

  auto-merge:
    needs: [test, lint-macos, test-macos, powershell, secret-scan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 11s, floor, measured 2026-08-27
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Hold PRs that need a human
        id: hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # scripts/auto-merge-gate.sh holds a bot PR without automerge-ok,
        # any PR changing uv.lock without pyproject.toml, and any PR gh cannot
        # list in full; it writes merge=true|false to GITHUB_OUTPUT, and exits
        # 1 (red) when it cannot decide.
        #
        # The gate runs as it exists on the BASE commit, never the PR's copy:
        # otherwise a PR editing the script is judged by its own edited gate,
        # and scripts/ lacks the `workflows` token scope that guards changes to
        # this file. A base without the script (the PR that adds it) is held
        # for a human; a failed fetch is red.
        #
        # The GITHUB_OUTPUT + `if:` on the merge step is load-bearing. An earlier
        # draft used `exit 0` to hold -- which does NOT stop the next step, so the
        # merge ran anyway while the log claimed it was held. Do not re-split this
        # into an exit-code guard.
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_SHA}" \
            || { echo "cannot fetch the base commit -- refusing to auto-merge" >&2; exit 1; }
          gate="${RUNNER_TEMP}/auto-merge-gate.sh"
          if ! git show "${BASE_SHA}:scripts/auto-merge-gate.sh" > "${gate}"; then
            echo "no auto-merge gate on the base commit -- leaving open for a human"
            echo "merge=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bash "${gate}" "${PR_NUMBER}"

      - name: Auto-merge passing PRs
        if: steps.hold.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Merge the PR the gate judged, at the commit it judged: by number rather
        # than by looking up the head branch, and refused if the head moved.
        run: gh pr merge "${PR_NUMBER}" --squash --match-head-commit "${HEAD_SHA}"
