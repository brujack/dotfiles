name: CI

on:
  pull_request:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # p90 342s, measured 2026-08-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: sudo apt-get install -y bats zsh

      - name: Install shellcheck (pinned)
        env:
          SC_VER: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SC_VER}"

      - name: Install uv (pinned)
        env:
          UV_VER: "0.12.5"
          UV_SHA256: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VER}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          uv --version | grep -q "uv ${UV_VER}"

      - name: Run tests
        run: make test

      - name: Verify test count floor (≥ 840)
        run: |
          COUNT=$(grep -r "^@test" tests/ | wc -l | tr -d ' ')
          printf "Test count: %d\n" "${COUNT}"
          if [ "${COUNT}" -lt 840 ]; then
            printf "FAIL: test count %d is below the floor of 840\n" "${COUNT}" >&2
            exit 1
          fi

  lint-macos:
    runs-on: macos-latest
    timeout-minutes: 10 # p90 12s, floor, measured 2026-08-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Syntax check all shell scripts (bash)
        run: |
          files=$(make print-SHELL_FILES | tr ' ' '\n' | grep -c .)
          if [ "${files}" -eq 0 ]; then
            printf 'shell file list is EMPTY - refusing to pass having checked nothing\n' >&2
            exit 1
          fi
          make print-SHELL_FILES | tr ' ' '\n' | xargs -I{} bash -n {}

      - name: Syntax check all zsh files
        run: |
          files=$(git ls-files '*.zsh' '*.zsh-theme' '.zshrc' '.zprofile' 'config/profiles.sh')
          if [ -z "${files}" ]; then
            printf 'zsh file list is EMPTY - refusing to pass having checked nothing\n' >&2
            exit 1
          fi
          printf '%s\n' "${files}" | xargs -I{} zsh -n {}

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30 # provisional; re-size to ~3x p90 after five green runs
    # The repo's default token is read-write, and this job runs unpinned
    # Homebrew bottles. It only needs to read the checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bash, bats and GNU parallel
        run: brew install bash bats-core parallel

      - name: Install shellcheck (pinned)
        env:
          SC_VER: "0.11.0"
          SC_SHA256: "56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79"
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.darwin.aarch64.tar.xz"
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SC_VER}"

      - name: Install uv (pinned)
        env:
          UV_VER: "0.12.5"
          UV_SHA256: "5bb0e5fe008a773c3dbcb97ff79cd89e1241464fe9d2f986d52ad8f1b037bd62"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VER}/uv-aarch64-apple-darwin.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m755 /tmp/uv-aarch64-apple-darwin/uv /usr/local/bin/uv
          uv --version | grep -q "uv ${UV_VER}"

      - name: Tool versions
        run: |
          bash --version | head -1
          bats --version
          make --version | head -1
          parallel --version | head -1

      - name: Run tests
        run: |
          set +e
          make test > /tmp/make-test.log 2>&1 < /dev/null
          rc=$?
          bash scripts/ci-suite-report.sh /tmp/make-test.log tests
          report_rc=$?
          if [ "${rc}" -ne 0 ]; then
            printf 'make test exited %d\n' "${rc}" >&2
            tail -40 /tmp/make-test.log
            exit 1
          fi
          exit "${report_rc}"

  powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p90 60s, measured 2026-08-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          source /etc/os-release
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install Pester + PSScriptAnalyzer
        run: |
          pwsh -Command "Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0"
          pwsh -Command "Install-Module PSScriptAnalyzer -Force -Scope CurrentUser"

      - name: Run tests with coverage gate
        working-directory: powershell
        run: |
          set -o pipefail
          make test | tee /tmp/pester-out.txt

      - name: Publish PowerShell coverage badge
        run: |
          PCT=$(grep "^Coverage:" /tmp/pester-out.txt | grep -oP '\d+(?:\.\d+)?' | head -1 | python3 -c "import sys,math; print(math.floor(float(sys.stdin.read().strip())))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          printf '{"schemaVersion":1,"label":"PowerShell coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/powershell.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: powershell.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

  bash-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # p90 492s, measured 2026-08-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: sudo apt-get install -y bats zsh

      - name: Install shellcheck (pinned)
        env:
          SC_VER: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SC_VER}"

      - name: Install uv (pinned)
        env:
          UV_VER: "0.12.5"
          UV_SHA256: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
        run: |
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VER}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          uv --version | grep -q "uv ${UV_VER}"

      - name: Run bash coverage (gate at 91%)
        run: |
          make bash-coverage > /tmp/bash-cov-out.txt 2>&1 || { cat /tmp/bash-cov-out.txt; exit 1; }
          cat /tmp/bash-cov-out.txt
          PCT=$(grep "^Overall bash coverage:" /tmp/bash-cov-out.txt | grep -oE '[0-9]+')
          if [ -z "${PCT}" ]; then
            printf "FAIL: coverage output not found\n" >&2
            exit 1
          fi
          printf "Coverage: %d%%\n" "${PCT}"
          if [ "${PCT}" -lt 91 ]; then
            printf "FAIL: bash coverage %d%% is below the 91%% gate\n" "${PCT}" >&2
            exit 1
          fi

      - name: Publish bash coverage badge
        run: |
          PCT=$(grep "^Overall bash coverage:" /tmp/bash-cov-out.txt | grep -oE '[0-9]+')
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          printf '{"schemaVersion":1,"label":"bash coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/bash.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: bash.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 8s, floor, measured 2026-08-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -e
          source lib/constants.sh
          wget -qO /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts "HEAD~50..HEAD" \
            --verbose

  auto-merge:
    needs: [test, lint-macos, test-macos, powershell, bash-coverage, secret-scan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p90 11s, floor, measured 2026-08-27
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Hold PRs that need a human
        id: hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # scripts/auto-merge-gate.sh holds a Renovate PR without automerge-ok,
        # any PR changing uv.lock without pyproject.toml, and any PR gh cannot
        # list in full; it writes merge=true|false to GITHUB_OUTPUT, and exits
        # 1 (red) when it cannot decide.
        #
        # The gate runs as it exists on the BASE commit, never the PR's copy:
        # otherwise a PR editing the script is judged by its own edited gate,
        # and scripts/ lacks the `workflows` token scope that guards changes to
        # this file. A base without the script (the PR that adds it) is held
        # for a human; a failed fetch is red.
        #
        # The GITHUB_OUTPUT + `if:` on the merge step is load-bearing. An earlier
        # draft used `exit 0` to hold -- which does NOT stop the next step, so the
        # merge ran anyway while the log claimed it was held. Do not re-split this
        # into an exit-code guard.
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_SHA}" \
            || { echo "cannot fetch the base commit -- refusing to auto-merge" >&2; exit 1; }
          gate="${RUNNER_TEMP}/auto-merge-gate.sh"
          if ! git show "${BASE_SHA}:scripts/auto-merge-gate.sh" > "${gate}"; then
            echo "no auto-merge gate on the base commit -- leaving open for a human"
            echo "merge=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bash "${gate}" "${PR_NUMBER}"

      - name: Auto-merge passing PRs
        if: steps.hold.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Merge the PR the gate judged, at the commit it judged: by number rather
        # than by looking up the head branch, and refused if the head moved.
        run: gh pr merge "${PR_NUMBER}" --squash --match-head-commit "${HEAD_SHA}"
