name: uv-lock-refresh

# Weekly uv.lock refresh. Opens or updates one PR from chore/uv-lock-refresh
# with GITHUB_TOKEN, and closes that PR when master already holds the
# resolution. Such a PR starts no CI of its own: the operator starts it
# with a close and reopen, then merges by hand (the auto-merge gate holds bot
# PRs). Spec: docs/superpowers/specs/2026-11-08-uv-lock-refresh-design.md
#
# Three jobs, split by trust. The resolve runs PyPI build code for sdist-only
# packages, so it runs in a job with only read access, no token exposed to its
# steps and no persisted credentials; a separate job holds the write scopes and
# takes from the artifact only the six named files, a validated result word and
# the PR body text; a third files the failure issue from uploaded logs.

on:
  schedule:
    # Monday 06:00 UTC, after Renovate's "before 5am on monday" window.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The repo's default workflow permission is write, so this line is load-bearing.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A scheduled run and a manual dispatch must never overlap: both could see no
# open PR and both try to create one.
concurrency:
  group: uv-lock-refresh
  cancel-in-progress: false

# Load-bearing: bash runs with pipefail, so a failure inside a tee pipeline
# fails the step.
defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A dispatch can name any ref; the refresh must be master plus a lock-only
      # change, so refuse anything else before touching the tree.
      - name: Require master ref
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            printf 'refusing to run from %s; dispatch from master\n' "${GITHUB_REF}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Install uv (pinned)
        env:
          UV_VER: "0.13.0"
          UV_SHA256: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
        run: |
          {
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/uv.tar.gz \
              "https://github.com/astral-sh/uv/releases/download/${UV_VER}/uv-x86_64-unknown-linux-gnu.tar.gz"
            echo "${UV_SHA256}  /tmp/uv.tar.gz" | sha256sum -c -
            tar -xzf /tmp/uv.tar.gz -C /tmp
            sudo install -m755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
            uv --version | grep -q "uv ${UV_VER}"
          } 2>&1 | tee "${RUNNER_TEMP}/10-install-uv.log"

      - name: Refresh lock
        run: |
          mkdir -p "${RUNNER_TEMP}/out"
          # stdout carries only the result word; the script's tool output is stderr.
          { bash scripts/refresh-uv-lock.sh "${RUNNER_TEMP}/out/body.md" > "${RUNNER_TEMP}/refresh.out"; } \
            2>&1 | tee "${RUNNER_TEMP}/20-refresh.log"
          result="$(tail -n 1 "${RUNNER_TEMP}/refresh.out")"
          case "${result}" in
            "changed" | "no changes") ;;
            *)
              printf 'unexpected result word: %s\n' "${result}" 2>&1 | tee -a "${RUNNER_TEMP}/20-refresh.log"
              exit 1
              ;;
          esac
          printf '%s\n' "${result}" > "${RUNNER_TEMP}/out/result"
          if [[ "${result}" == "changed" ]]; then
            cp uv.lock requirements-ci.txt requirements-runtime-ci.txt requirements-ci-test.txt requirements-ci-mutation.txt requirements-ci-audit.txt "${RUNNER_TEMP}/out/"
          fi

      - name: Upload refresh output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: refresh-out
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7
          # A re-run attempt reuses the run id; overwrite lets it upload at all.
          overwrite: true

      - name: Upload refresh logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: refresh-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
          retention-days: 7
          # A re-run attempt reuses the run id; overwrite lets it upload at all.
          overwrite: true

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The refresh commit goes on top of current master and replaces the branch
      # with a plain force-push; this checkout keeps its credentials because
      # this job pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh-out
          path: ${{ runner.temp }}/in

      - name: Read refresh result
        id: refresh
        run: |
          {
            result="$(cat "${RUNNER_TEMP}/in/result")"
            case "${result}" in
              "changed" | "no changes") ;;
              *)
                printf 'unexpected result: %s\n' "${result}"
                exit 1
                ;;
            esac
            printf 'result=%s\n' "${result}" >> "${GITHUB_OUTPUT}"
          } 2>&1 | tee "${RUNNER_TEMP}/30-read-result.log"

      # Exactly the six files, by name: the artifact came from a job that ran
      # third-party build code, so no other file enters the tree (the result
      # word is validated above and body.md is only PR body text).
      - name: Stage refreshed files
        if: steps.refresh.outputs.result == 'changed'
        run: |
          {
            cp "${RUNNER_TEMP}/in/uv.lock" uv.lock
            cp "${RUNNER_TEMP}/in/requirements-ci.txt" requirements-ci.txt
            cp "${RUNNER_TEMP}/in/requirements-runtime-ci.txt" requirements-runtime-ci.txt
            cp "${RUNNER_TEMP}/in/requirements-ci-test.txt" requirements-ci-test.txt
            cp "${RUNNER_TEMP}/in/requirements-ci-mutation.txt" requirements-ci-mutation.txt
            cp "${RUNNER_TEMP}/in/requirements-ci-audit.txt" requirements-ci-audit.txt
          } 2>&1 | tee "${RUNNER_TEMP}/40-stage.log"

      # The repo is public and a fork can name its branch the same; only a PR
      # from this repository counts.
      - name: Find open refresh PR
        id: find_pr
        run: |
          {
            prs="$(gh pr list --head chore/uv-lock-refresh --state open --json number,isCrossRepository --jq '[.[]|select(.isCrossRepository==false)]')"
            count="$(jq 'length' <<< "${prs}")"
            if [[ "${count}" -gt 1 ]]; then
              printf 'more than one open refresh PR: %s\n' "${count}"
              exit 1
            fi
            number="$(jq -r '.[0].number // empty' <<< "${prs}")"
            printf 'number=%s\n' "${number}" >> "${GITHUB_OUTPUT}"
          } 2>&1 | tee "${RUNNER_TEMP}/50-find-pr.log"

      - name: Publish refresh branch and PR
        if: steps.refresh.outputs.result == 'changed'
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
        run: |
          {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git switch -C chore/uv-lock-refresh
            git add -- uv.lock requirements-ci.txt requirements-runtime-ci.txt requirements-ci-test.txt requirements-ci-mutation.txt requirements-ci-audit.txt
            git commit -m "chore(deps): refresh uv.lock"
            git push --force origin chore/uv-lock-refresh
            if [[ -n "${PR_NUMBER}" ]]; then
              gh pr edit "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/in/body.md"
            else
              gh pr create --base master --head chore/uv-lock-refresh \
                --title "chore(deps): refresh uv.lock" --body-file "${RUNNER_TEMP}/in/body.md"
            fi
          } 2>&1 | tee "${RUNNER_TEMP}/60-publish.log"

      - name: Close refresh PR when nothing changed
        if: steps.refresh.outputs.result == 'no changes' && steps.find_pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
        run: |
          {
            gh pr comment "${PR_NUMBER}" --body "master already holds the current resolution; closing."
            gh pr close "${PR_NUMBER}"
          } 2>&1 | tee "${RUNNER_TEMP}/70-close-pr.log"

      - name: Close failure issue
        run: |
          {
            issue="$(gh issue list --state open --limit 1000 --json number,title --jq '[.[]|select(.title == "uv.lock refresh failed")]|.[0].number // empty')"
            if [[ -n "${issue}" ]]; then
              gh issue comment "${issue}" --body "Recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              gh issue close "${issue}"
            fi
          } 2>&1 | tee "${RUNNER_TEMP}/80-close-issue.log"

      - name: Upload publish logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publish-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
          retention-days: 7
          # A re-run attempt reuses the run id; overwrite lets it upload at all.
          overwrite: true

  report:
    needs: [refresh, publish]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download step logs
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-logs"
          merge-multiple: true
          path: ${{ runner.temp }}/logs

      - name: Report failure
        if: always()
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          newest=""
          if [[ -d "${RUNNER_TEMP}/logs" ]]; then
            # Downloaded files all carry extraction-time mtimes, so order by the
            # numeric name prefix: a failed step stops its job, so the highest
            # number is the failing (or last-run) step.
            name="$(find "${RUNNER_TEMP}/logs" -maxdepth 1 -name '[0-9][0-9]-*.log' -printf '%f\n' | LC_ALL=C sort | tail -n 1)"
            if [[ -n "${name}" ]]; then
              newest="${RUNNER_TEMP}/logs/${name}"
            fi
          fi
          {
            printf 'Run: %s\n\n' "${run_url}"
            if [[ -n "${newest}" ]]; then
              printf 'Last 40 lines of %s:\n\n```\n' "$(basename "${newest}")"
              tail -n 40 "${newest}"
              printf '```\n'
            else
              printf 'No step log was written before the failure.\n'
            fi
          } > "${RUNNER_TEMP}/failure-body.md"
          issue="$(gh issue list --state open --limit 1000 --json number,title --jq '[.[]|select(.title == "uv.lock refresh failed")]|.[0].number // empty')"
          if [[ -n "${issue}" ]]; then
            gh issue comment "${issue}" --body-file "${RUNNER_TEMP}/failure-body.md"
          else
            gh issue create --title "uv.lock refresh failed" --body-file "${RUNNER_TEMP}/failure-body.md"
          fi
